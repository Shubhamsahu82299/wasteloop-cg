name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/wasteloop?sslmode=disable
      DIRECT_URL: postgresql://ci:ci@localhost:5432/wasteloop?sslmode=disable
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_00000000000000000000000000000000000000000000
      S3_BUCKET: ci-evidence
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run db:generate
      - run: npm test
      - run: npm run lint -- src
      - run: npx tsc --noEmit
      - run: npm run build
